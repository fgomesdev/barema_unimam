<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barema</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <a href="https://unimam.com.br/" target="_blank">
        <img src="logo/UNIMAM.png" alt="unimam">
        </a>
        <h1></h1>
    </header>
<section>
    <div class="campo-nome">
    <label for="nomealuno">Seu nome completo (opcional, para conferir os certificados):</label>
    <input type="text" id="nomealuno" maxlength="80" autocomplete="name" placeholder="Ex.: Maria da Silva Santos">
    <div class="campo-curso">
<div class="campo-disciplina">
  <select name="cursos" id="cursos" class="cursos">
    <option value="" disabled selected hidden>Selecione seu curso..</option>
    
    <optgroup label="Ciências Exatas">
      <option value="arquitetura-e-urbanismo">Arquitetura e Urbanismo</option>
      <option value="sistemas-para-internet">Sistemas para Internet</option>
      <option value="engenharia-civil">Engenharia Civil</option>
    </optgroup>

    <optgroup label="Ciências da Saúde">
      <option value="biomedicina">Biomedicina</option>
      <option value="educacao-fisica">Educação Física</option>
      <option value="enfermagem">Enfermagem</option>
      <option value="farmacia">Farmácia</option>
      <option value="fisioterapia">Fisioterapia</option>
      <option value="nutricao">Nutrição</option>
      <option value="odontologia">Odontologia</option>
      <option value="psicologia">Psicologia</option>
      <option value="tecnologo-radiologia">Tecnólogo em Radiologia</option>
    </optgroup>

    <optgroup label="Ciências Sociais e Humanas">
      <option value="administracao">Administração</option>
      <option value="ciencias-contabeis">Ciências Contábeis</option>
      <option value="direito">Direito</option>
      <option value="geografia">Geografia</option>
      <option value="historia">História</option>
      <option value="pedagogia">Pedagogia</option>
      <option value="servico-social">Serviço Social</option>
    </optgroup>
  </select>
</div>
     <div class="grupo-topo">
<label id="aprovacao">Envie aqui os seus certificados: <br> <p>DOCx, PDF, JPG, JPEG OU PNG </p></label>
<input type="file" id="arquivos" accept=".pdf,.docx, .jpg, .jpeg, .png" multiple>
<label for="arquivos" id="escolher" >Escolher arquivos</label>
</div>
<button id="enviar">ENVIAR</button>
<p id="status"></p>
<ul id="listaarquivos"></ul>
</section>

<!-- AQUI APARECE O RESULTADO DEPOIS DE CLICAR EM ENVIAR (comeca escondido) -->
<div id="resultado">
    <h2>Certificados lidos</h2>
    <p class="dica">Confira cada linha. Se alguma atividade ou quantidade estiver errada, corrija aqui mesmo e a conta é refeita.</p>
    <table class="cartoes">
        <thead>
            <tr>
                <th>Arquivo</th>
                <th>Atividade do barema</th>
                <th class="centro">Quantidade</th>
                <th class="centro">Vale</th>
                <th class="centro">Remover</th>
            </tr>
        </thead>
        <tbody id="tabelacertificados"></tbody>
    </table>

    <h2>Barema</h2>
    <table>
        <thead>
            <tr>
                <th>Atividade</th>
                <th>Convertidas</th>
                <th>Limite</th>
                <th>Válidas</th>
            </tr>
        </thead>
        <tbody id="tabelabarema"></tbody>
    </table>

    <p id="mensagemfinal"></p>
    <button id="baixarrelatorio">Gerar relatório (PDF)</button> 
</div>

<footer>
<button id="baremaunimam" onclick="window.open('logo/Resolução_Atividades Complementares.pdf', '_blank');">
    Visualizar Barema Da UNIMAM
</button>
</footer>

   <!-- BIBLIOTECAS PRONTAS: pdf.js le PDF, mammoth le DOCX. Precisam vir ANTES do index.js -->
   <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/mammoth@1.13.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
   <script src="index.js"></script>
</body>
</html>
